<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Engine & Ecosystem v7.5</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs (Compat v9/v10 para navegador) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- BARRA SUPERIOR / NAVEGAÇÃO & ECONOMIA -->
    <header class="topbar">
        <div class="logo">⚡ Vortex Engine <small>v7.5</small></div>
        
        <div class="economy-bar">
            <span class="wallet">💰 Saldo: R$ <strong id="user-balance">0.00</strong></span>
            <button class="btn btn-reward" onclick="claimDailyReward()">🎁 Recompensa Diária</button>
            <button class="btn btn-pix" onclick="simulateIncomingPix()">💸 Receber Pix</button>
        </div>

        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('engine')">🎮 Engine 2D</button>
            <button class="tab-btn" onclick="switchTab('store')">🌐 Loja Global</button>
        </nav>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-container">

        <!-- ABA 1: VORTEX ENGINE 2D -->
        <section id="tab-engine" class="tab-content active">
            <div class="engine-layout">
                
                <!-- HIERARQUIA (PASTAS, OBJETOS, SCRIPTS) -->
                <aside class="panel hierarchy-panel">
                    <h3>📂 Hierarquia</h3>
                    <div class="panel-actions">
                        <button onclick="addHierarchyItem('folder')">+ Pasta</button>
                        <button onclick="addHierarchyItem('square')">+ Quadrado</button>
                        <button onclick="addHierarchyItem('circle')">+ Círculo</button>
                        <button onclick="addHierarchyItem('button')">+ Botão UI</button>
                        <button onclick="addHierarchyItem('script')">+ Script</button>
                    </div>
                    <ul id="hierarchy-tree" class="tree-list">
                        <!-- Itens gerados via JS -->
                    </ul>
                </aside>

                <!-- VIEWPORT / MAP BUILDER 2D -->
                <section class="panel viewport-panel">
                    <div class="viewport-header">
                        <span>🗺️ CENA 2D / MAP BUILDER</span>
                        <div class="map-controls">
                            <label>Ferramenta de Mapa:</label>
                            <button onclick="setTileMode('block')">🧱 Bloco</button>
                            <button onclick="setTileMode('coin')">🪙 Moeda</button>
                            <button onclick="setTileMode('erase')">❌ Borracha</button>
                        </div>
                    </div>
                    <div id="canvas-2d" class="grid-canvas">
                        <!-- Grid 2D interativo -->
                    </div>
                </section>

                <!-- INSPECTOR & PROPRIEDADES -->
                <aside class="panel inspector-panel">
                    <h3>⚙️ Inspetor</h3>
                    <div id="inspector-content">
                        <p class="placeholder-text">Selecione um elemento na hierarquia.</p>
                    </div>
                </aside>

            </div>
        </section>

        <!-- ABA 2: LOJA GLOBAL (FIREBASE) -->
        <section id="tab-store" class="tab-content">
            <div class="store-layout">
                <div class="store-header">
                    <h2>🛒 Loja Global de Jogos & Apps</h2>
                    <button class="btn btn-primary" onclick="openPublishModal()">➕ Publicar Meu Jogo</button>
                </div>

                <div id="global-apps-list" class="apps-grid">
                    <p>Carregando aplicativos da nuvem...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL DE PUBLICAÇÃO DE JOGO -->
    <div id="publish-modal" class="modal">
        <div class="modal-content">
            <h3>🚀 Publicar na Loja Global</h3>
            <label>Nome do Jogo/App:</label>
            <input type="text" id="app-title-input" placeholder="Ex: Super Vortex Bros">
            
            <label>Preço de Venda (R$):</label>
            <input type="number" id="app-price-input" value="10" min="0">

            <div class="modal-actions">
                <button class="btn" onclick="closePublishModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="publishAppToGlobalStore()">Publicar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
