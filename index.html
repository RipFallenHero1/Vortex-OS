<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex OS 1.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons para ícones estilo Windows -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- 1. TELA DE BOOT (DESLIGADO) -->
    <div id="boot-screen" class="screen active">
        <div class="power-container">
            <button id="power-btn" class="power-button">
                <i data-lucide="power"></i>
            </button>
            <p>Clique para ligar o Vortex OS 1.0</p>
        </div>
    </div>

    <!-- 2. TELA DE LOGIN / CADASTRO -->
    <div id="auth-screen" class="screen hidden">
        <div class="auth-card">
            <div class="avatar-box">
                <i data-lucide="user"></i>
            </div>
            <h2 id="auth-title">Vortex OS</h2>
            
            <!-- Formulário de Login -->
            <form id="login-form" class="auth-form">
                <input type="email" id="login-email" placeholder="E-mail" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit" class="btn-primary">Entrar</button>
                <p class="auth-switch">Não tem conta? <a href="#" id="to-register">Cadastre-se</a></p>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="register-form" class="auth-form hidden">
                <input type="text" id="reg-name" placeholder="Seu Nome" required>
                <input type="email" id="reg-email" placeholder="E-mail" required>
                <input type="password" id="reg-password" placeholder="Senha (mín. 6 caracteres)" required>
                <button type="submit" class="btn-primary">Criar Conta</button>
                <p class="auth-switch">Já possui conta? <a href="#" id="to-login">Fazer Login</a></p>
            </form>
            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- 3. TELA DA ÁREA DE TRABALHO (DESKTOP) -->
    <div id="desktop-screen" class="screen hidden">
        <!-- Ícones da Área de Trabalho -->
        <div class="desktop-icons">
            <div class="icon" onclick="vortexOS.openApp('files')">
                <i data-lucide="folder"></i>
                <span>Arquivos</span>
            </div>
            <div class="icon" onclick="vortexOS.openApp('notepad')">
                <i data-lucide="file-text"></i>
                <span>Bloco de Notas</span>
            </div>
            <div class="icon" onclick="vortexOS.openApp('calculator')">
                <i data-lucide="calculator"></i>
                <span>Calculadora</span>
            </div>
            <div class="icon" onclick="vortexOS.openApp('settings')">
                <i data-lucide="settings"></i>
                <span>Configurações</span>
            </div>
        </div>

        <!-- Conteiner de Janelas Ativas -->
        <div id="window-container"></div>

        <!-- Menu Iniciar -->
        <div id="start-menu" class="start-menu hidden">
            <div class="start-header">
                <div class="user-info">
                    <div class="user-avatar"><i data-lucide="user"></i></div>
                    <span id="system-user-name">Usuário</span>
                </div>
            </div>
            <div class="start-apps">
                <div class="start-app-item" onclick="vortexOS.openApp('files')">
                    <i data-lucide="folder"></i> <span>Gerenciador de Arquivos</span>
                </div>
                <div class="start-app-item" onclick="vortexOS.openApp('notepad')">
                    <i data-lucide="file-text"></i> <span>Bloco de Notas</span>
                </div>
                <div class="start-app-item" onclick="vortexOS.openApp('calculator')">
                    <i data-lucide="calculator"></i> <span>Calculadora</span>
                </div>
                <div class="start-app-item" onclick="vortexOS.openApp('settings')">
                    <i data-lucide="settings"></i> <span>Configurações</span>
                </div>
            </div>
            <div class="start-footer">
                <button onclick="vortexOS.restartSystem()" title="Reiniciar">
                    <i data-lucide="rotate-cw"></i> Reiniciar
                </button>
                <button onclick="vortexOS.shutdownSystem()" title="Desligar" class="danger">
                    <i data-lucide="power"></i> Desligar
                </button>
            </div>
        </div>

        <!-- Barra de Tarefas (Taskbar estilo Windows) -->
        <div class="taskbar">
            <button id="start-btn" class="start-button">
                <i data-lucide="command"></i>
            </button>
            <div id="taskbar-apps" class="taskbar-apps"></div>
            <div class="system-tray">
                <div id="clock" class="clock">00:00</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- App Scripts -->
    <script src="script.js"></script>
</body>
</html>
