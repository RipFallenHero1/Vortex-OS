<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex OS 1.2</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- 1. TELA DE BOOT -->
    <div id="boot-screen" class="screen active">
        <div class="power-container">
            <button id="power-btn" class="power-button">
                <i data-lucide="power"></i>
            </button>
            <p class="power-text">VORTEX OS 1.2</p>
            <span class="power-subtext">Clique para iniciar o sistema</span>
        </div>
    </div>

    <!-- 2. TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen" class="screen hidden">
        <div class="auth-card">
            <div class="avatar-box" id="auth-avatar">
                <i data-lucide="user"></i>
            </div>
            <h2 id="auth-title">Vortex OS</h2>
            <p class="auth-subtitle" id="auth-subtitle">Digite seu PIN de acesso</p>

            <button type="button" id="google-btn" class="btn-google">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Entrar com Google</span>
            </button>

            <div class="divider"><span>ou acesse com PIN</span></div>

            <!-- Login PIN -->
            <form id="pin-login-form" class="auth-form">
                <input type="email" id="login-email" placeholder="E-mail registrado" required>
                <div class="pin-wrapper">
                    <input type="password" id="login-pin" placeholder="PIN" maxlength="6" pattern="[0-9]*" inputmode="numeric" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember-session" checked>
                    <label for="remember-session">Lembrar da minha sessão</label>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
                <p class="auth-switch">Não tem PIN? <a href="#" id="to-register">Criar Conta</a></p>
            </form>

            <!-- Cadastro PIN -->
            <form id="pin-register-form" class="auth-form hidden">
                <input type="text" id="reg-name" placeholder="Nome de Exibição" required>
                <input type="text" id="reg-username" placeholder="@username" required>
                <input type="email" id="reg-email" placeholder="E-mail principal" required>
                <div class="pin-wrapper">
                    <input type="password" id="reg-pin" placeholder="Crie seu PIN" maxlength="6" pattern="[0-9]*" inputmode="numeric" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
                <p class="auth-switch">Já tem um PIN? <a href="#" id="to-login">Fazer Login</a></p>
            </form>

            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- 3. ÁREA DE TRABALHO -->
    <div id="desktop-screen" class="screen hidden">
        <div class="desktop-icons">
            <div class="icon" onclick="vortexOS.openApp('files')">
                <div class="icon-badge"><i data-lucide="folder"></i></div>
                <span>Arquivos</span>
            </div>
            <div class="icon" onclick="vortexOS.openApp('notepad')">
                <div class="icon-badge"><i data-lucide="file-text"></i></div>
                <span>Bloco de Notas</span>
            </div>
            <div class="icon" onclick="vortexOS.openApp('calculator')">
                <div class="icon-badge"><i data-lucide="calculator"></i></div>
                <span>Calculadora</span>
            </div>
            <div class="icon" onclick="vortexOS.openApp('settings')">
                <div class="icon-badge"><i data-lucide="settings"></i></div>
                <span>Configurações</span>
            </div>
        </div>

        <div id="window-container"></div>

        <!-- Menu Iniciar Fiel ao Windows 11 -->
        <div id="start-menu" class="start-menu hidden">
            <div class="start-search">
                <i data-lucide="search"></i>
                <input type="text" placeholder="Digitar aqui para pesquisar...">
            </div>
            
            <div class="start-section-title">Fixados</div>
            <div class="start-grid">
                <div class="start-grid-item" onclick="vortexOS.openApp('files')">
                    <div class="app-icon-box"><i data-lucide="folder"></i></div>
                    <span>Arquivos</span>
                </div>
                <div class="start-grid-item" onclick="vortexOS.openApp('notepad')">
                    <div class="app-icon-box"><i data-lucide="file-text"></i></div>
                    <span>Bloco de Notas</span>
                </div>
                <div class="start-grid-item" onclick="vortexOS.openApp('calculator')">
                    <div class="app-icon-box"><i data-lucide="calculator"></i></div>
                    <span>Calculadora</span>
                </div>
                <div class="start-grid-item" onclick="vortexOS.openApp('settings')">
                    <div class="app-icon-box"><i data-lucide="settings"></i></div>
                    <span>Configurações</span>
                </div>
            </div>

            <div class="start-footer">
                <div class="user-info">
                    <div class="user-avatar" id="desktop-avatar"><i data-lucide="user"></i></div>
                    <div class="user-text-details">
                        <span id="system-user-name">Usuário</span>
                        <small id="system-user-handle">@usuario</small>
                    </div>
                </div>
                <div class="start-power-actions">
                    <button onclick="vortexOS.restartSystem()" title="Reiniciar">
                        <i data-lucide="rotate-cw"></i>
                    </button>
                    <button onclick="vortexOS.shutdownSystem()" title="Desligar/Sair" class="danger">
                        <i data-lucide="power"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Barra de Tarefas Estilo Windows 11 -->
        <div class="taskbar">
            <div class="taskbar-center">
                <button id="start-btn" class="start-button" title="Menu Iniciar Vortex">
                    <i data-lucide="command"></i>
                </button>
                <div id="taskbar-apps" class="taskbar-apps"></div>
            </div>
            <div class="system-tray">
                <div id="clock-time" class="clock-time">00:00</div>
                <div id="clock-date" class="clock-date">00/00/0000</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
